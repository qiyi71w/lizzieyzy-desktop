[workspace]
resolver = "2"
members = ["crates/lizzie-core", "src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a float the UI sends (JSON's shortest round-trip decimal) parses to the same
# f64, so a value echoed back in a view equals what was sent.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Serde-only attributes (aliases kept for reading Java-written values) do not affect TypeScript.
ts-rs = { version = "12", features = ["no-serde-warnings"] }

# Line tables keep file:line in panic backtraces. Full debug info made each linked test binary
# about 200 MB, so one `cargo test` wrote over 10 GB and waited on the disk.
[profile.dev]
debug = "line-tables-only"

# Unoptimised, the big-number arithmetic of SSH key exchange in debug builds takes longer than
# the connection's key exchange limit.
[profile.dev.package.num-bigint]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
