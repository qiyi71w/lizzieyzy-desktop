[workspace]
resolver = "2"
members = ["crates/lizzie-core", "src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Serde-only attributes (aliases kept for reading Java-written values) do not affect TypeScript.
ts-rs = { version = "12", features = ["no-serde-warnings"] }

[profile.release]
codegen-units = 1
lto = true
